name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-fastapi/requirements.txt

      - name: Install dependencies
        working-directory: backend-fastapi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend-fastapi
        # Rule selection lives in pyproject.toml so local runs match CI.
        run: ruff check app

      - name: Import check
        working-directory: backend-fastapi
        # Catches broken imports and syntax errors without needing credentials -
        # settings all have defaults, so the app constructs cleanly.
        run: python -c "import app.main; print('app imports OK')"

      - name: Tests
        working-directory: backend-fastapi
        # Test paths come from pyproject.toml (app/, eval/, tests/). These run
        # without credentials - the LLM and tools are stubbed.
        run: pytest -q

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # Non-blocking: there are ~42 pre-existing violations (mostly unused
        # vars). Failing on them would make CI red from day one and train
        # everyone to ignore it. Output stays visible so the debt is tracked.
        # Flip to blocking once the backlog is cleared.
        continue-on-error: true
        run: npm run lint

      - name: Build
        working-directory: frontend
        # This one *is* blocking - a broken build must never merge.
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-fastapi
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
